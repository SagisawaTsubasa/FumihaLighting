calibrate:
  name: 开始校准
  description: >-
    启动恒照度曲线自动校准：灯从 0 到 100% 再回扫一遍，全程约 15~25 分钟，
    期间请不要在卫生间活动。同一卫生间一次只能校准一个区：不带目标时启动
    第一个可校准区域（其余跳过并记日志）；带目标时若目标未命中任何区域、
    或命中区域因校准互斥未能启动，服务会抛错。
  target:
    entity:
      integration: fumiha_lighting
trigger_now:
  name: 立即触发
  description: >-
    对所有夜灯组立即执行锚点归位：清除手动接管标记并重新下发当前时段参数。
