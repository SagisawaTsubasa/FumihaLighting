calibrate:
  name: 开始校准
  description: >-
    启动恒照度曲线自动校准：灯从 0 到 100% 再回扫一遍，期间请不要在卫生
    间活动。默认 5% 步长全程约 15~40 分钟（传感器上报不畅时可能接近 1 小
    时）；2%/3% 细扫最坏可能 2~3 小时（含传感器上报等待），请耐心等待或
    改用更大步长。同一卫生间一次只能校准一个区：不带目标时启动第一个可校
    准区域（其余跳过并记日志）；带目标时若目标未命中任何区域、或命中区域
    因校准互斥未能启动，服务会抛错。
  target:
    entity:
      integration: fumiha_lighting
trigger_now:
  name: 立即触发
  description: >-
    对所有夜灯组立即执行锚点归位：清除手动接管标记并重新下发当前时段参数。
    日间恒照度联动开启的组在日间触发时改为确保虚拟恒照度灯开启（由恒照度
    闭环接管，不对真实灯下发日间参数）；组内灯全关且「仅调整已开启的灯」
    开启时跳过接管。
