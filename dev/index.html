<!DOCTYPE html>
<!-- Fumiha Lighting dev harness — REAL shell + BOTH page modules over mockHass.
  ?dark=1 ?failapi=1 ?badlux=1 ?badanl=1 ?standalone=1 -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fumiha Lighting dev harness</title>
<style>
  html, body { margin: 0; height: 100%; }
  fumiha-hub-panel { display: block; height: 100%; }
  .fx-dialog { border: 1px solid var(--fx-edge); border-radius: 10px; padding: 16px 18px; background: var(--fx-panel); color: var(--fx-txt); min-width: 280px; max-width: 90vw; }
  .fx-dialog::backdrop { background: rgba(0,0,0,.35); }
</style>
</head>
<body>
<fumiha-hub-panel id="hub"></fumiha-hub-panel>
<script type="module" src="/fumiha_hub/fumiha-hub.js"></script>
<script>
  var params = new URLSearchParams(location.search);
  if (params.has("dark")) {
    var darkVars = {
      "primary-background-color": "#111111", "card-background-color": "#1c1c1c",
      "secondary-background-color": "#282828", "divider-color": "#333333",
      "primary-text-color": "#e1e1e1", "secondary-text-color": "#9b9b9b",
      "primary-color": "#03a9f4", "success-color": "#43a047",
      "warning-color": "#ffb300", "error-color": "#ff5252",
    };
    Object.keys(darkVars).forEach(function (k) {
      document.documentElement.style.setProperty("--" + k, darkVars[k]);
    });
  }
  var luxModule = params.has("badlux")
    ? "/fumiha_lighting/missing-lux.js?ver=1.0.0"
    : "/fumiha_lighting/page-lux.js?ver=1.0.0";
  var anlModule = params.has("badanl")
    ? "/fumiha_lighting/missing-anl.js?ver=1.0.0"
    : "/fumiha_lighting/page-anl.js?ver=1.0.0";
  var failApi = params.has("failapi");
  window.__servicePosts = [];

  function luxZones() {
    // ?cal=1 → 校准进行中态（取消按钮依赖此渲染，FL-IMP-26）
    const calibrating = new URLSearchParams(location.search).get("cal") === "1";
    return [{
      entry_id: "lux1", zone_name: "卫生间", mode: calibrating ? "calibrating" : "active",
      cal_progress: calibrating ? "上行 35%" : "",
      target_lux: 150.0, commanded_pct: 45.0, target_min: 10, target_max: 500,
      // R1 发现 10：target_step 随载荷下发（web._serialize_lux_zone 契约）
      target_step: 5,
      lux_stale: false,
      curve: { source: "calibrated", max_lux: 186.3, slope_20_80: 2.41,
        points: [[0, 0], [10, 18.2], [30, 112.4], [55, 176.9], [80, 185.1], [100, 186.3]] },
      decisions: ["22:41:03 [lux] lux=42 环境=42 需求=108 → set 45%"],
      ambient_lux_est: 42.5, needed_lux: 107.5,
      last_adjustment: "2026-10-13T12:00:00+08:00",
      light_entity: "light.bath", lux_entity: "sensor.bath_lux",
      // V1.3.0 联动组（web._serialize_lux_zone 契约）：组标签+同组成员名单
      link_group: "卫生间", link_peers: ["干区"],
    }];
  }
  function anlManagers() {
    // ?ci=1 → 日间恒照度开启态（V1.5.0 manager 摘要 tag 的夹具）
    // ?cibroken=1 → 谎报形状（F-061）：清单配置着但虚拟灯未配——
    // day_ci_lights 非空而 day_ci_active=false，chip/逐灯弹窗只认生效值，
    // 不得显示恒照度接管
    var q = new URLSearchParams(location.search);
    var ci = q.get("ci") === "1";
    var ciBroken = q.get("cibroken") === "1";
    var ciStorage = ci || ciBroken;
    return [{
      entry_id: "anl1", title: "自动夜灯", current_mode: "night",
      next_anchor: "2026-10-13T23:30:00+08:00",
      anchors: [{ time: "23:30", mode: "night" }, { time: "06:56", mode: "day" }],
      lights: [
        { entity_id: "light.bedroom", state: "verified", manual_override: false,
          mismatch_steps: 0, target: [12, 2700], applied: [12, 2700], last_error: null },
        { entity_id: "light.hallway", state: "mismatch", manual_override: true,
          mismatch_steps: 2, target: [12, 2700], applied: null, last_error: null },
      ],
      start_mode: "sunset", end_mode: "sunrise",
      // ANL-F-046：两字段真实分叉——transition_enabled=true（end_transition>0）
      // 而 transitions_active=false（日间关闭 → manager 归零），chip 只能读后者
      transition_enabled: true, transitions_active: false,
      day_enabled: true, respect_manual: true,
      // web._serialize_anl_manager 契约（V1.6.0 单灯化）：三键随快照下发——
      // day_ci_lights 接管清单、day_ci_active 生效值（_ci_configured()，可与
      // 配置分叉）、day_ci_virtual_light（字符串或 null）
      day_ci_lights: ciStorage ? ["light.bedroom"] : [],
      day_ci_active: ci,
      // cibroken：清单配置着但虚拟灯未配（null）→ 生效值 false 的分叉源
      day_ci_virtual_light: ci ? "light.bedroom_heng_zhao_du_deng" : null,
    }];
  }
  function anlConfig() {
    // 编辑器数据契约（web.AnlConfigView.get）：config 白名单键 + limits。
    // ?cibroken=1 时存储层同样开着——编辑面读存储值，F-061 的分叉只发生在
    // 快照生效值上
    var q = new URLSearchParams(location.search);
    var ci = q.get("ci") === "1" || q.get("cibroken") === "1";
    return {
      ok: true,
      config: {
        lights: ["light.bedroom", "light.hallway"],
        // start_mode 故意用枚举外值：钉 ANL-F-031（枚举不匹配时追加展示
        // 而非静默回落首项「固定时间」）
        start_mode: "noon", end_mode: "sunrise",
        trigger_time: "22:00:00", end_time: "06:00:00",
        start_offset: 0, end_offset: 15, sun_entity: "sun.sun",
        transition_enabled: false, start_transition: 0, end_transition: 0,
        transition_interval: 5,
        day_enabled: true, brightness: 25, color_temp_kelvin: 2200,
        // V1.6.0 契约：config 白名单键换 day_ci_lights（默认空清单；?ci=1
        // 预勾 bedroom 并预填虚拟灯；?cibroken=1 清单开着但虚拟灯空）
        day_ci_lights: ci ? ["light.bedroom"] : [],
        day_ci_virtual_light: ci ? "light.bedroom_heng_zhao_du_deng" : "",
        day_brightness: 100, day_color_temp_kelvin: 4000,
        tolerance_brightness: 4, tolerance_kelvin: 150,
        verify_delay: 5, settle_delay: 1,
        turn_on_listen: true, only_when_on: false, respect_manual: true,
        // extra_count 为死键（ANL-F-029），夹具不再携带
        extras: [{ name: "晚餐", start: "18:00:00", brightness: 60,
                   color_temp_kelvin: 3000, transition: 0 }],
        overrides: {},
      },
      // limits 由后端 limits_payload() 生成后原样贴入（勿手改；ANL-F-043：
      // 服务端 limits 主路径必须在 L2 被执行，恒 null 会让主路径零覆盖）
      limits: {"times":{"start_offset":{"min":-120,"max":120,"step":5,"default":0,"unit":"min"},"end_offset":{"min":-120,"max":120,"step":5,"default":0,"unit":"min"},"start_transition":{"min":0,"max":120,"step":5,"default":0,"unit":"min"},"end_transition":{"min":0,"max":120,"step":5,"default":0,"unit":"min"},"transition_interval":{"min":1,"max":15,"step":1,"default":5,"unit":"min"}},"params":{"brightness":{"min":1,"max":100,"step":1,"default":25,"unit":"%"},"color_temp_kelvin":{"min":1500,"max":6500,"step":100,"default":2200,"unit":"K"},"day_brightness":{"min":1,"max":100,"step":1,"default":100,"unit":"%"},"day_color_temp_kelvin":{"min":1500,"max":6500,"step":100,"default":4000,"unit":"K"},"tolerance_brightness":{"min":0,"max":25,"step":1,"default":4,"unit":"%"},"tolerance_kelvin":{"min":0,"max":1000,"step":50,"default":150,"unit":"K"},"verify_delay":{"min":0,"max":60,"step":1,"default":5,"unit":"s"},"settle_delay":{"min":0,"max":10,"step":0.5,"default":1,"unit":"s"}},"extras":{"brightness":{"min":1,"max":100,"step":1,"default":60,"unit":"%"},"color_temp_kelvin":{"min":1500,"max":6500,"step":100,"default":3000,"unit":"K"},"transition":{"min":0,"max":120,"step":5,"default":0,"unit":"min"}},"enums":{"start_mode":["fixed","sunset","sunrise"],"end_mode":["fixed","sunset","sunrise"]},"max_extras":5},
    };
  }

  var mockHass = {
    language: "zh-Hans",
    themes: { darkMode: params.has("dark") },
    callService: async function () {},
    fetchWithAuth: async function (path, options) {
      var method = (options && options.method) || "GET";
      if (failApi && method === "GET") {
        return new Response(JSON.stringify({ error: "simulated failure" }), { status: 500 });
      }
      if (method === "POST") {
        window.__servicePosts.push({ path: path, body: options && options.body });
        // R1 发现 11：?caldone=1 模拟「校准刚好自行结束」——取消端点返回
        // cancelled:false（真实端点 web.py:354 契约），page-lux.js 的
        // FL-IMP-24 分支在 L2 从此可达
        if (params.has("caldone")
            && path.indexOf("/api/fumiha_lighting/lux/calibrate/cancel") === 0) {
          return new Response(JSON.stringify({ ok: true, cancelled: false }), { status: 200 });
        }
        return new Response(JSON.stringify({ ok: true, started: true, triggered: 1 }), { status: 200 });
      }
      if (path.indexOf("/api/fumiha_hub/panels") === 0) {
        return new Response(JSON.stringify({
          dir_rev: 7,
          panels: [
            { id: "luxbalance.main", title: "亮度均衡", icon: "mdi:tune-vertical",
              order: 10, version: "1.0.0", module_url: luxModule, element: "lux-balance-page" },
            { id: "anl.main", title: "夜灯助手", icon: "mdi:weather-night",
              order: 20, version: "1.0.0", module_url: anlModule, element: "anl-page" },
          ],
        }), { status: 200 });
      }
      if (path.indexOf("/api/fumiha_lighting/lux/overview") === 0) {
        return new Response(JSON.stringify({ zones: luxZones() }), { status: 200 });
      }
      if (path.indexOf("/api/fumiha_lighting/anl/snapshot") === 0) {
        return new Response(JSON.stringify({ managers: anlManagers() }), { status: 200 });
      }
      if (path.indexOf("/api/fumiha_lighting/anl/config") === 0) {
        if (params.has("badconfig")) {
          // ANL-F-035 钉：extras 形状坏 → 弹窗构建期抛错 → 必须经 onclick
          // 的 .catch 落成 ack toast（不得无声）
          var bad = anlConfig();
          bad.config.extras = "oops";
          return new Response(JSON.stringify(bad), { status: 200 });
        }
        return new Response(JSON.stringify(anlConfig()), { status: 200 });
      }
      return new Response(JSON.stringify({ error: "no route: " + path }), { status: 404 });
    },
  };
  window.__mockHass = mockHass;

  var panel = document.getElementById("hub");
  if (params.has("standalone")) {
    panel.remove();
  } else {
    customElements.whenDefined("fumiha-hub-panel").then(function () {
      panel.hass = mockHass;
    });
  }
</script>
</body>
</html>
