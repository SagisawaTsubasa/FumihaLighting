[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "homeassistant"]

[tool.ruff.lint.per-file-ignores]
"dev/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
